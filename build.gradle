plugins {
	id 'fabric-loom' version '1.13.1'
	id 'maven-publish'
}


version = '1.4.3-1.21.11'
group = 'com.radik'
base {
	archivesName = 'RadikCore'
}

test {
	useJUnitPlatform()
}

repositories {
	maven { url = "https://maven.blamejared.com/" }

	mavenCentral()
	maven { url 'https://maven.fabricmc.net/' }
	maven { url = 'https://maven.minecraftforge.net/' }
	maven { url 'https://plugins.gradle.org/m2/' }
	maven { url 'https://jitpack.io' }
}

dependencies {
	implementation include('commons-logging:commons-logging:1.3.4')
	implementation include('com.squareup.okio:okio-jvm:3.6.0')
	implementation include('org.telegram:telegrambots-abilities:9.0.0')

	testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
	testImplementation 'org.mockito:mockito-core:5.0.0'
	testImplementation 'org.mockito:mockito-junit-jupiter:5.0.0'
	testImplementation 'com.google.guava:guava:32.1.3-jre'
	testImplementation 'org.junit.jupiter:junit-jupiter-engine:5.10.0'
	testImplementation 'org.junit.platform:junit-platform-launcher:1.10.0'

	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	modImplementation 'com.github.glitchfiend:TerraBlender-fabric:1.21.11-21.11.0.0'
}

processResources {
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	options.compilerArgs << "-Xlint:deprecation"
}

java {
	withSourcesJar()
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

sourceSets {
	main {
		resources {
			srcDirs += ['src/main/generated']
		}
	}
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
}

fabricApi {
	configureDataGeneration() {
		client = true
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = base.archivesName.get()
			from components.java
		}
	}
	repositories {}
}

test {
	useJUnitPlatform()
	testLogging {
		events "passed", "skipped", "failed"
	}
}